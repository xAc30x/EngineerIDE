name: CI

# Runs the automated part of the roadmap's definition of done: type check,
# tests, and build. The two-window check in the running app is still manual.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The lowest Node.js version the README supports.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron downloads its binary on first use, not during npm ci. Fetch it
      # here so the download does not run inside a test's time limit.
      - name: Download Electron binary
        run: npx --no install-electron

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
